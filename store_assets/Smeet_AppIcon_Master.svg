<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- ========================================== -->
  <!-- Smeet App Icon - FINAL                    -->
  <!-- 概念：wordmark 中的 "m" 字母放大为符号    -->
  <!--      = 两个运动伙伴并肩 = 匹配 + 相遇     -->
  <!-- ========================================== -->
  
  <!-- 背景：Smeet Teal -->
  <rect width="1024" height="1024" fill="#1ABC9C"/>
  
  <g fill="#FFFFFF">
    <!-- 双人头部 - 居中、对称 -->
    <circle cx="394" cy="320" r="88"/>
    <circle cx="630" cy="320" r="88"/>
    
    <!-- m 字母主体 / 双人身体并肩 -->
    <!-- 左半：从底部上升，圆顶 -->
    <path d="
      M 240 760
      L 240 560
      C 240 470, 309 420, 394 420
      C 463 420, 506 462, 506 528
      L 506 760
      Z
    "/>
    <!-- 右半：与左半镜像，中间留细缝表示"两个人" -->
    <path d="
      M 518 760
      L 518 528
      C 518 462, 561 420, 630 420
      C 715 420, 784 470, 784 560
      L 784 760
      Z
    "/>
  </g>
</svg>
