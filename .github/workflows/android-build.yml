name: Android Build

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/smeet-keystore.jks

      - name: Print signing certificate fingerprints
        # Certificate fingerprints are public (they ship inside every APK).
        # Printed here so they can be copied into Firebase (Android app >
        # Add fingerprint) for Google sign-in.
        run: |
          keytool -list -v \
            -keystore android/app/smeet-keystore.jks \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            | grep -E "SHA1:|SHA256:" || true

      - name: Create key.properties
        run: |
          {
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "storeFile=smeet-keystore.jks"
          } > android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: smeet-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Build APK (for testing)
        run: flutter build apk --release

      - name: Upload .apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: smeet-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
