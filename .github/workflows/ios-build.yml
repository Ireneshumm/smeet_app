name: iOS Build

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload IPA to App Store Connect / TestFlight'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build & Deploy iOS IPA
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Validate required secrets
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for var in \
            IOS_BUNDLE_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY \
            IOS_DIST_CERT_P12_BASE64 \
            IOS_DIST_CERT_PASSWORD \
            IOS_PROVISION_PROFILE_BASE64; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Using bundle ID: $IOS_BUNDLE_ID"

      - name: Resolve temp paths
        run: |
          echo "PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision" >> "$GITHUB_ENV"
          echo "EXPORT_OPTIONS_PATH=$RUNNER_TEMP/ExportOptions.plist" >> "$GITHUB_ENV"
          echo "ASC_KEY_DIR=$HOME/.appstoreconnect/private_keys" >> "$GITHUB_ENV"
          echo "P12_PATH=$RUNNER_TEMP/dist.p12" >> "$GITHUB_ENV"

      - name: Decode, verify, and import distribution certificate
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          # Strip whitespace/newlines that often break GitHub secret pastes.
          CERT_B64="$(printf '%s' "$IOS_DIST_CERT_P12_BASE64" | tr -d '\n\r\t ')"
          CERT_PASS="$(printf '%s' "$IOS_DIST_CERT_PASSWORD" | tr -d '\r')"

          printf '%s' "$CERT_B64" | base64 --decode > "$P12_PATH"
          FILE_SIZE="$(wc -c < "$P12_PATH" | tr -d ' ')"
          echo "Decoded .p12 size: ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -lt 100 ]; then
            echo "::error::Decoded .p12 is too small (${FILE_SIZE} bytes). Re-encode IOS_DIST_CERT_P12_BASE64 with: base64 -i YourCert.p12 | pbcopy"
            exit 1
          fi

          # Verify password against the .p12 before keychain import.
          if ! openssl pkcs12 -in "$P12_PATH" -noout -passin "pass:${CERT_PASS}" 2>/dev/null \
            && ! openssl pkcs12 -in "$P12_PATH" -noout -passin "pass:${CERT_PASS}" -legacy 2>/dev/null; then
            echo "::error::IOS_DIST_CERT_PASSWORD does not unlock the .p12 (or the base64 is corrupt)."
            echo "::error::Re-export Apple Distribution cert from Keychain Access as .p12, set that export password as IOS_DIST_CERT_PASSWORD, then: base64 -i cert.p12 | pbcopy → IOS_DIST_CERT_P12_BASE64"
            exit 1
          fi

          echo "Certificate password verified successfully"

          KEYCHAIN_PATH="$RUNNER_TEMP/smeet-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed -e 's/"//g')

          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASS" \
            -A \
            -t cert \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Eq "Apple Distribution|iPhone Distribution"; then
            echo "::error::No Apple Distribution identity found after certificate import"
            exit 1
          fi

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail
          mkdir -p "$ASC_KEY_DIR"
          KEY_PATH="$ASC_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          if printf '%s' "$APP_STORE_CONNECT_API_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$KEY_PATH"
          else
            printf '%s' "$APP_STORE_CONNECT_API_KEY" | tr -d '\n\r\t ' | base64 --decode > "$KEY_PATH"
          fi

          chmod 600 "$KEY_PATH"
          echo "Installed App Store Connect API key"

      - name: Install provisioning profile
        id: profile
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | tr -d '\n\r\t ' | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          PROFILE_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist" | sed "s/^${TEAM_ID}\.//")

          cp "$PROFILE_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          echo "Installed profile: $PROFILE_NAME ($PROFILE_UUID)"
          echo "Team ID: $TEAM_ID"
          echo "Profile bundle ID: $PROFILE_BUNDLE_ID"
          echo "Workflow bundle ID: $IOS_BUNDLE_ID"

          if [ "$PROFILE_BUNDLE_ID" != "$IOS_BUNDLE_ID" ] && [ "$PROFILE_BUNDLE_ID" != "*" ]; then
            echo "::warning::Provisioning profile bundle ID ($PROFILE_BUNDLE_ID) does not match IOS_BUNDLE_ID ($IOS_BUNDLE_ID)"
          fi

      - name: Set iOS bundle identifier
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re

          bundle_id = os.environ["IOS_BUNDLE_ID"]
          path = pathlib.Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          def replace_bundle_id(match: re.Match[str]) -> str:
              block = match.group(0)
              if "TEST_HOST" in block:
                  return re.sub(
                      r"PRODUCT_BUNDLE_IDENTIFIER = [^;]+;",
                      f"PRODUCT_BUNDLE_IDENTIFIER = {bundle_id}.RunnerTests;",
                      block,
                  )
              return re.sub(
                  r"PRODUCT_BUNDLE_IDENTIFIER = [^;]+;",
                  f"PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};",
                  block,
              )

          updated = re.sub(
              r"buildSettings = \{.*?\n\t\t\t\};",
              replace_bundle_id,
              text,
              flags=re.S,
          )
          path.write_text(updated)
          print(f"Set app PRODUCT_BUNDLE_IDENTIFIER to {bundle_id}")
          PY

      - name: Create ExportOptions.plist
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib

          payload = {
              "method": "app-store",
              "signingStyle": "manual",
              "teamID": os.environ["TEAM_ID"],
              "stripSwiftSymbols": True,
              "compileBitcode": False,
              "destination": "export",
              "manageAppVersionAndBuildNumber": False,
              "provisioningProfiles": {
                  os.environ["IOS_BUNDLE_ID"]: os.environ["PROFILE_NAME"],
              },
          }

          path = os.environ["EXPORT_OPTIONS_PATH"]
          with open(path, "wb") as handle:
              plistlib.dump(payload, handle)
          print(f"Wrote {path}")
          PY
          plutil -p "$EXPORT_OPTIONS_PATH"

      - name: Get dependencies
        run: flutter pub get

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build IPA
        run: |
          set -euo pipefail
          flutter build ipa --release \
            --export-options-plist="$EXPORT_OPTIONS_PATH" \
            -- \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Resolve IPA path
        id: ipa
        run: |
          set -euo pipefail
          IPA_PATH="$(find build/ios/ipa -maxdepth 2 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa found under build/ios/ipa"
            ls -laR build/ios || true
            exit 1
          fi
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          ls -la "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: smeet-release-ipa
          path: ${{ steps.ipa.outputs.path }}
          retention-days: 30

      - name: Upload to App Store Connect
        if: ${{ github.event_name == 'push' || github.event.inputs.upload_to_testflight == 'true' }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "${{ steps.ipa.outputs.path }}" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Cleanup signing materials
        if: always()
        run: |
          set +e
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null
          rm -f "$P12_PATH" "$PROFILE_PATH"
          rm -f "$ASC_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
