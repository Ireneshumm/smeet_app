# iOS deploy — FlutterGo-style archive/export, mapped to this repo's secrets.
name: iOS Build

on:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload IPA to App Store Connect / TestFlight'
        required: true
        default: true
        type: boolean
      build_name:
        description: 'Marketing version (e.g. 1.0.0)'
        required: false
      build_number:
        description: 'Build number'
        required: false

jobs:
  build:
    name: Build & Deploy iOS IPA
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build version args
        id: ver
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.build_name }}" ]; then
            ARGS="$ARGS --build-name=${{ github.event.inputs.build_name }}"
          fi
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            ARGS="$ARGS --build-number=${{ github.event.inputs.build_number }}"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Normalize secrets
        env:
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for var in \
            IOS_BUNDLE_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY \
            IOS_DIST_CERT_P12_BASE64 \
            IOS_DIST_CERT_PASSWORD \
            IOS_PROVISION_PROFILE_BASE64; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          # Strip paste whitespace/newlines from secrets.
          echo "IOS_BUNDLE_ID=$(printf '%s' "$IOS_BUNDLE_ID" | tr -d '\n\r\t ')" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_KEY_ID=$(printf '%s' "$APP_STORE_CONNECT_KEY_ID" | tr -d '\n\r\t ')" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_ISSUER_ID=$(printf '%s' "$APP_STORE_CONNECT_ISSUER_ID" | tr -d '\n\r\t ')" >> "$GITHUB_ENV"
          echo "Using bundle ID: $(printf '%s' "$IOS_BUNDLE_ID" | tr -d '\n\r\t ')"

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Verify Distribution certificate
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning
          if ! security find-identity -v -p codesigning | grep -Eq "Apple Distribution|iPhone Distribution"; then
            echo "::error::Apple Distribution certificate not found. Upload an Apple Distribution .p12 (not Development)."
            exit 1
          fi

      - name: Stage App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys" "$HOME/.appstoreconnect/private_keys" "./private_keys"
          export KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          python3 - <<'PY'
          import base64
          import os
          import re
          import textwrap
          from pathlib import Path

          raw = os.environ.get("APP_STORE_CONNECT_API_KEY", "")
          key_path = Path(os.environ["KEY_PATH"])

          raw = raw.replace("\r\n", "\n").replace("\r", "\n").strip()
          raw = raw.replace("\\n", "\n")

          def is_pem(text: str) -> bool:
              return "BEGIN PRIVATE KEY" in text and "END PRIVATE KEY" in text

          def as_pem(text: str) -> str:
              return text if text.endswith("\n") else text + "\n"

          def wrap_der_as_pem(der: bytes) -> str:
              body = base64.b64encode(der).decode("ascii")
              return (
                  "-----BEGIN PRIVATE KEY-----\n"
                  + "\n".join(textwrap.wrap(body, 64))
                  + "\n-----END PRIVATE KEY-----\n"
              )

          if is_pem(raw):
              content = as_pem(raw)
              mode = "pem"
          else:
              compact = re.sub(r"\s+", "", raw)
              try:
                  decoded = base64.b64decode(compact, validate=False)
              except Exception as exc:
                  raise SystemExit(
                      f"Failed to base64-decode APP_STORE_CONNECT_API_KEY: {exc}"
                  ) from exc

              try:
                  text = decoded.decode("utf-8")
              except UnicodeDecodeError:
                  text = ""

              if text and is_pem(text):
                  content = as_pem(text)
                  mode = "base64-pem"
              elif decoded.startswith(b"\x30"):
                  # Common when secret is base64 of raw key bytes (~120-160 bytes).
                  content = wrap_der_as_pem(decoded)
                  mode = "base64-der-wrapped"
              else:
                  print("::error::APP_STORE_CONNECT_API_KEY is not a valid AuthKey .p8")
                  print(f"Secret length: {len(raw)} chars; decoded: {len(decoded)} bytes")
                  print("Set the secret to either:")
                  print("  1) Full PEM text including BEGIN/END PRIVATE KEY lines")
                  print("  2) Output of: base64 -i AuthKey_XXX.p8 | pbcopy")
                  raise SystemExit(1)

          if not is_pem(content):
              print("::error::Normalized key still missing BEGIN/END PRIVATE KEY markers")
              raise SystemExit(1)

          key_path.write_text(content, encoding="utf-8")
          print(f"Staged ASC API key via {mode} ({key_path.stat().st_size} bytes)")
          PY

          chmod 600 "$KEY_PATH"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          cp "$KEY_PATH" "./private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Raise iOS deployment target to 15.0
        run: |
          set -euo pipefail
          if [ -f ios/Podfile ]; then
            if grep -qE "platform :ios" ios/Podfile; then
              sed -i.bak -E "s/platform :ios, *'[0-9.]+'/platform :ios, '15.0'/" ios/Podfile || true
            else
              { echo "platform :ios, '15.0'"; cat ios/Podfile; } > ios/Podfile.tmp && mv ios/Podfile.tmp ios/Podfile
            fi
          fi
          if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
            sed -i.bak 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' \
              ios/Runner.xcodeproj/project.pbxproj
          fi

      - name: Build iOS IPA (xcodebuild + manual App Store profile)
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          # Compile unsigned first — avoids Pods/SPM Development signing conflicts.
          flutter build ios --release --no-codesign ${{ steps.ver.outputs.args }}

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$RUNNER_TEMP/Smeet_AppStore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/Smeet_profile.plist"
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | LC_ALL=C tr -d '\n\r\t ' | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$PROFILE_PLIST")
          PROFILE_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$PROFILE_PLIST" | sed "s/^${TEAM_ID}\.//")
          PROFILE_GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:get-task-allow' "$PROFILE_PLIST" 2>/dev/null || echo false)

          if [ "$PROFILE_GET_TASK_ALLOW" = "true" ]; then
            echo "::error::Uploaded profile is Development (get-task-allow=true). Use an App Store distribution profile for $IOS_BUNDLE_ID."
            exit 1
          fi

          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "Installed App Store profile: $PROFILE_NAME ($PROFILE_UUID)"
          echo "Team ID: $TEAM_ID"
          echo "Profile bundle ID: $PROFILE_BUNDLE_ID"
          echo "Workflow bundle ID: $IOS_BUNDLE_ID"

          if [ "$PROFILE_BUNDLE_ID" != "$IOS_BUNDLE_ID" ] && [ "$PROFILE_BUNDLE_ID" != "*" ]; then
            echo "::error::Provisioning profile bundle ID ($PROFILE_BUNDLE_ID) does not match IOS_BUNDLE_ID ($IOS_BUNDLE_ID)"
            exit 1
          fi

          PBX=ios/Runner.xcodeproj/project.pbxproj
          echo "Manual archive signing with App Store profile"

          # Ensure Runner uses Manual + Distribution + this profile.
          sed -i.bak 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBX"
          sed -i.bak "s/DEVELOPMENT_TEAM = [A-Z0-9]*/DEVELOPMENT_TEAM = $TEAM_ID/g" "$PBX"
          sed -i.bak 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' "$PBX"
          sed -i.bak 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' "$PBX"
          sed -i.bak 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution"/g' "$PBX"
          sed -i.bak 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "Apple Development"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution"/g' "$PBX"
          sed -i.bak "s/PRODUCT_BUNDLE_IDENTIFIER = com\.smeet\.smeetapp;/PRODUCT_BUNDLE_IDENTIFIER = $IOS_BUNDLE_ID;/g" "$PBX"
          sed -i.bak "s/PRODUCT_BUNDLE_IDENTIFIER = com\.smeet\.smeetapp\.RunnerTests;/PRODUCT_BUNDLE_IDENTIFIER = ${IOS_BUNDLE_ID}.RunnerTests;/g" "$PBX"

          # Inject signing keys into Runner build settings if missing.
          if ! grep -q 'PROVISIONING_PROFILE_SPECIFIER' "$PBX"; then
            perl -i.bak2 -0777 -pe "s/(INFOPLIST_FILE = Runner\/Info\.plist;\n)/\$1\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = $TEAM_ID;\n\t\t\t\tCODE_SIGN_IDENTITY = \"Apple Distribution\";\n\t\t\t\t\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";\n\t\t\t\tPROVISIONING_PROFILE = \"$PROFILE_UUID\";\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = $IOS_BUNDLE_ID;\n/g" "$PBX"
          else
            sed -i.bak "s/PROVISIONING_PROFILE_SPECIFIER = \"[^\"]*\"/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\"/g" "$PBX"
            sed -i.bak "s/PROVISIONING_PROFILE = \"[^\"]*\"/PROVISIONING_PROFILE = \"$PROFILE_UUID\"/g" "$PBX"
          fi

          ARCHIVE_PATH="$PWD/build/ios/archive/Runner.xcarchive"
          EXPORT_PATH="$PWD/build/ios/ipa"
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$EXPORT_PATH"

          # Do NOT pass CODE_SIGN_IDENTITY globally — conflicts with Pods auto-signing.
          # Do NOT use -allowProvisioningUpdates with a local App Store profile.
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0"><dict>'
            echo '  <key>method</key><string>app-store-connect</string>'
            echo '  <key>signingStyle</key><string>manual</string>'
            echo "  <key>teamID</key><string>$TEAM_ID</string>"
            echo '  <key>signingCertificate</key><string>Apple Distribution</string>'
            echo '  <key>provisioningProfiles</key><dict>'
            echo "    <key>$IOS_BUNDLE_ID</key><string>$PROFILE_NAME</string>"
            echo '  </dict>'
            echo '  <key>uploadSymbols</key><true/>'
            echo '  <key>manageAppVersionAndBuildNumber</key><false/>'
            echo '</dict></plist>'
          } > ios/ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$EXPORT_PATH"

          shopt -s nullglob
          ipa_files=("$EXPORT_PATH"/*.ipa)
          if [ ${#ipa_files[@]} -eq 0 ]; then
            echo "::error::xcodebuild export produced no .ipa in $EXPORT_PATH"
            ls -la "$EXPORT_PATH" || true
            exit 1
          fi
          ls -la "${ipa_files[@]}"
          echo "IPA_PATH=${ipa_files[0]}" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: smeet-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      - name: Upload to TestFlight / App Store
        if: ${{ github.event_name == 'push' || github.event.inputs.upload_to_testflight == 'true' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipa_files=(build/ios/ipa/*.ipa)
          if [ ${#ipa_files[@]} -eq 0 ]; then
            echo "::error::No IPA found under build/ios/ipa/"
            exit 1
          fi
          IPA="${ipa_files[0]}"
          echo "IPA size: $(wc -c < "$IPA") bytes"
          file "$IPA" || true
          unzip -t "$IPA" >/dev/null

          # altool looks for AuthKey_<KEY_ID>.p8 in these directories.
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          if [ ! -s "$KEY_PATH" ] || ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::ASC API key missing/invalid at $KEY_PATH"
            exit 1
          fi
          mkdir -p "$PWD/private_keys" "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_PATH" "$PWD/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          echo "Uploading $IPA to TestFlight with apiKey=$APP_STORE_CONNECT_KEY_ID …"
          # iTMSTransporter is no longer usable on GitHub-hosted runners
          # (moved to Mac App Store Transporter). Use altool instead.
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Cleanup
        if: always()
        run: |
          set +e
          rm -f "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          rm -f "./private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          rm -f ios/ExportOptions.plist
